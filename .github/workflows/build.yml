name: Build APK

# Works two ways:
#  1. Repo root IS the project (android/ and rust-core/ at the top): builds in place.
#  2. Repo root holds only HorizonModConverter-source.zip: it is unzipped first.
on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Locate source
      run: |
        if [ -d android ] && [ -d rust-core ]; then
          echo "SRC=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
        elif [ -f HorizonModConverter-source.zip ]; then
          mkdir -p src && unzip -q HorizonModConverter-source.zip -d src
          echo "SRC=$GITHUB_WORKSPACE/src" >> "$GITHUB_ENV"
        else
          echo "No android/ + rust-core/ folders and no HorizonModConverter-source.zip in the repo root"; exit 1
        fi

    - name: Prepare log folder
      run: mkdir -p "$GITHUB_WORKSPACE/logs"

    - uses: actions/setup-java@v4
      with: { java-version: '17', distribution: 'temurin', cache: gradle }

    - uses: dtolnay/rust-toolchain@stable
      with: { targets: aarch64-linux-android }

    - name: Install cargo-ndk
      id: ndk
      continue-on-error: true
      run: |
        set -o pipefail
        cargo install cargo-ndk --locked 2>&1 | tee "$GITHUB_WORKSPACE/logs/ndk.log"

    - name: Test Rust engine
      id: rust
      continue-on-error: true
      working-directory: ${{ env.SRC }}/rust-core
      run: |
        set -o pipefail
        cargo test --workspace 2>&1 | tee "$GITHUB_WORKSPACE/logs/rust.log"

    - name: Build debug and release APKs
      id: apk
      continue-on-error: true
      working-directory: ${{ env.SRC }}/android
      run: |
        set -o pipefail
        export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
        echo "NDK: $ANDROID_NDK_HOME"
        chmod +x gradlew
        ./gradlew assembleDebug assembleRelease --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/logs/apk.log"

    - name: Build error report
      if: always()
      run: |
        python3 "$SRC/tools/make_error_report.py" "$GITHUB_WORKSPACE/logs" "$GITHUB_WORKSPACE/error-report.txt" \
          ndk=${{ steps.ndk.outcome }} rust=${{ steps.rust.outcome }} apk=${{ steps.apk.outcome }} || true
        {
          echo "## Build report"
          echo "Copy everything in the box below and paste it to Claude."
          echo '```text'
          cat "$GITHUB_WORKSPACE/error-report.txt" 2>/dev/null || echo "report not generated"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload error report and full logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          error-report.txt
          logs/
        if-no-files-found: ignore

    - name: Collect APKs
      if: steps.apk.outcome == 'success'
      run: |
        mkdir -p dist
        cp "$SRC/android/app/build/outputs/apk/debug/app-debug.apk" dist/HorizonModConverter-debug.apk
        cp "$SRC/android/app/build/outputs/apk/release/app-release.apk" dist/HorizonModConverter.apk

    - uses: actions/upload-artifact@v4
      if: steps.apk.outcome == 'success'
      with:
        name: apks
        path: dist/*.apk

    - name: Fail the job if any build step failed
      if: steps.ndk.outcome != 'success' || steps.rust.outcome != 'success' || steps.apk.outcome != 'success'
      run: |
        echo "A build step failed. Open the run summary and copy the 'Build report' box."
        exit 1
